[workspace]
resolver = "2"
members = ["anchor", "anchor_spl", "macro", "macro_core", "program", "address_lookup_table"]
exclude = ["dependencies"]

[workspace.dependencies]
anyhow = "1.0.69"
borsh = "0.10.1"
hex = "0.4.3"
kani = { path = "./dependencies/kani/library/kani", features = [
    "concrete_playback",
] }
num-traits = "0.2.19"
proc-macro2 = "1.0.49"
quote = "1.0.23"
syn = { version = "1.0.108", features = ["full"] }
thiserror = "1.0.65"
bytemuck = { version = "1.4.0", features = ["min_const_generics", "derive"] }
num_enum = "0.7.3"
